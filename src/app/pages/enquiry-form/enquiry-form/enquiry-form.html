<div class="form-page">

    <!-- ========================================= -->
    <!-- HEADER -->
    <!-- ========================================= -->

    <div class="form-header">

        <div>

            <h1 class="page-title">
                Enquiry Details
            </h1>

            <p class="page-subtitle">
                View and manage contact enquiry
            </p>

        </div>


        <a
            routerLink="/admin/enquiries"
            class="btn-back"
        >

            <i class="bi bi-arrow-left"></i>

            Back to Enquiries

        </a>

    </div>


    <!-- ========================================= -->
    <!-- FORM CARD -->
    <!-- ========================================= -->

    <div class="form-card">


        <!-- ========================================= -->
        <!-- CONTACT INFORMATION -->
        <!-- ========================================= -->

        <div class="form-section">

            <div class="section-title">

                <i class="bi bi-person"></i>

                Contact Information

            </div>


            <!-- NAME -->

            <div class="form-group">

                <label>
                    Name
                </label>

                <input
                    type="text"
                    [value]="enquiry.name"
                    readonly
                />

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label>
                    Email
                </label>

                <div class="input-action">

                    <input
                        type="text"
                        [value]="enquiry.email"
                        readonly
                    />

                    <button
                        type="button"
                        title="Send Email"
                        (click)="emailEnquirer()"
                    >

                        <i class="bi bi-envelope"></i>

                    </button>

                </div>

            </div>


            <!-- PHONE -->

            <div class="form-group">

                <label>
                    Phone
                </label>

                <div class="input-action">

                    <input
                        type="text"
                        [value]="enquiry.phone"
                        readonly
                    />

                    <button
                        type="button"
                        title="Call"
                        (click)="callEnquirer()"
                    >

                        <i class="bi bi-telephone"></i>

                    </button>

                </div>

            </div>


            <!-- TYPE -->

            <div class="form-group">

                <label>
                    Enquiry Type
                </label>

                <input
                    type="text"
                    [value]="enquiry.enquiryType"
                    readonly
                />

            </div>

        </div>


        <!-- ========================================= -->
        <!-- ENQUIRY -->
        <!-- ========================================= -->

        <div class="form-section">

            <div class="section-title">

                <i class="bi bi-chat-left-text"></i>

                Enquiry

            </div>


            <!-- SUBJECT -->

            <div class="form-group full-width">

                <label>
                    Subject
                </label>

                <input
                    type="text"
                    [value]="enquiry.subject"
                    readonly
                />

            </div>


            <!-- MESSAGE -->

            <div class="form-group full-width">

                <label>
                    Message
                </label>

                <textarea
                    [value]="enquiry.message"
                    rows="7"
                    readonly
                ></textarea>

            </div>


            <!-- DATE -->

            <div class="form-group">

                <label>
                    Received Date
                </label>

                <input
                    type="text"
                    [value]="enquiry.createdDate"
                    readonly
                />

            </div>

        </div>


        <!-- ========================================= -->
        <!-- ADMIN MANAGEMENT -->
        <!-- ========================================= -->

        <div class="form-section">

            <div class="section-title">

                <i class="bi bi-shield-check"></i>

                Admin Management

            </div>


            <!-- STATUS -->

            <div class="form-group">

                <label>
                    Status <span>*</span>
                </label>

                <select
                    [(ngModel)]="enquiry.status"
                >

                    <option
                        *ngFor="let status of statuses"
                        [value]="status"
                    >
                        {{ status }}
                    </option>

                </select>

            </div>


            <!-- PRIORITY -->

            <div class="form-group">

                <label>
                    Priority <span>*</span>
                </label>

                <select
                    [(ngModel)]="enquiry.priority"
                >

                    <option
                        *ngFor="let priority of priorities"
                        [value]="priority"
                    >
                        {{ priority }}
                    </option>

                </select>

            </div>


            <!-- REMARKS -->

            <div class="form-group full-width">

                <label>
                    Admin Remarks
                </label>

                <textarea
                    [(ngModel)]="enquiry.adminRemarks"
                    rows="5"
                    placeholder="Enter internal remarks..."
                ></textarea>

                <small class="field-help">
                    These remarks are for admin use and are not shown to the user.
                </small>

            </div>

        </div>


        <!-- ========================================= -->
        <!-- ACTIONS -->
        <!-- ========================================= -->

        <div class="form-actions">

            <button
                type="button"
                class="btn-cancel"
                (click)="cancel()"
            >

                Cancel

            </button>


            <button
                type="button"
                class="btn-save"
                (click)="saveEnquiry()"
            >

                <i class="bi bi-check-lg"></i>

                Update Enquiry

            </button>

        </div>

    </div>

</div>
